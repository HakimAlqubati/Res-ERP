<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="#F2F7F5"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="300" rx="90" ry="20" fill="#D3E0DC"/>

  <!-- Box Front Left -->
  <path d="M200 280L110 228V130L200 182V280Z" fill="#E8F1EE" stroke="#0E6951" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Box Front Right -->
  <path d="M200 280L290 228V130L200 182V280Z" fill="#FFFFFF" stroke="#0E6951" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Box Top -->
  <path d="M200 182L110 130L200 78L290 130L200 182Z" fill="#F8FBFA" stroke="#0E6951" stroke-width="8" stroke-linejoin="round"/>
  
