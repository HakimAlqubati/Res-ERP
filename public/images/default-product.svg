  <line x1="147" y1="172" x2="147" y2="202" stroke="#0E6951" stroke-width="6" stroke-linecap="round"/>
  <line x1="159" y1="179" x2="159" y2="209" stroke="#0E6951" stroke-width="8" stroke-linecap="round"/>
  <line x1="171" y1="186" x2="171" y2="216" stroke="#0E6951" stroke-width="4" stroke-linecap="round"/>
